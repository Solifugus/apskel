<link rel="stylesheet" href="{{@resource}}/jquery-ui/css/ui-lightness/jquery-ui-1.8.24.custom.css" type="text/css" media="screen"/>
<script type="text/javascript" src="{{@resource}}/jquery-ui/js/jquery-1.8.2.min.js"></script>
<script type="text/javascript" src="{{@resource}}/jquery-ui/js/jquery-ui-1.8.24.custom.min.js"></script>
<link rel="stylesheet" href="{{@resource}}/main.css" type="text/css" media="screen"/>

<div id="blog_edit_wrapper" class="view_wrapper">
	{{=application_header.html}}
	<span id="title" class="minor_title">{{page_title}}</span>
	<hr/>
	{{=message_area.html}}
	<br/>
	<hr/>
	<!-- View Specifics -->
	<form method="post" action="{{@link}}/edit">
		<input type="hidden" name="id" value="{{id}}"/>
		<input type="hidden" name="fresh" value="false"/>
		<label for="article_title" class="label">Title:</label><input id="article_title" class="input" name="title" value="{{title}}"/><br/>
		<label for="article" class="label">Article:</label><br/>
		<textarea id="article" class="description" name="article">{{article}}</textarea><br/>
		<label for="tags" class="label">Tags:</label><input id="tags" class="input" name="tags" value="{{tags}}"/><br/>
		<label for="publish" class="label">Publish (e.g. 2026-06-01, blank = draft):</label><input id="publish" class="input date" name="publish" value="{{publish}}"/><br/>
		<div id="button-bar">
			<input type="reset" id="reset" class="buton" value="Reset"/><input type="submit" id="submit" class="buton" value="Save Article"/><br/>
		</div>
	</form>
	<br/>
	<a href="{{@link}}/view">&laquo; Back to the blog</a>
	{{=application_footer.html}}
</div>
